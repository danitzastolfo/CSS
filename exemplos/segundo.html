<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CSS interno com classe e id</title>
    <style>
        *{
            background-color: whitesmoke;
            margin: 0;
            padding: 0;
        }
        #paragrafo{ /* id */
            color: purple;
            font-size: 24;
            background-color: aliceblue;
        }
        #informacoes{
            background-color: purple;
            color: aliceblue;
            text-align: center;
        }
        .titulo{ /* classe */
            background-color: blueviolet;
            color: white;
            font-weight: 100;
        }
        div a{
            color: purple;
        }
    </style>
</head>
<body>
    <p id="paragrafo">CSS aplicado no id</p>
    <p id="informacoes">informações complementares...</p>
    <h3 class="titulo">CSS aplicado na classe</h3>
    <h1 class="titulo">lulastê</h1>

    <table border="1" width="100%">
        <thead>
            <th>nome</th>
        </thead>
        <tbody>
            <td class="titulo">idade</td>
        </tbody>
    </table>
    <div>
        <a href="https://classroom.google.com/a/not-turned-in/all">primeiro link</a>
        <p>qualquer coisa</p>
    </div>
</body>
</html>
