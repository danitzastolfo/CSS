<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset='UTF-8'>
    <title>CSS interno</title>
    <!-- CSS interno: sempre na tag <head> -->
    <style>
        p { /* padroniza a tag */
            color: purple;
            font-size: 24px;
        }
        h1 {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <p>CSS interno da página</p>
    <h1>não sei</h1>
</body>
</html>
